<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendario académico | IE Ciudad de Tunja</title>
  <meta name="description" content="Fechas importantes, entregas de boletines, días festivos y eventos institucionales.">
  <script>document.documentElement.classList.add('js');setTimeout(function(){document.documentElement.classList.add('ready')},1800)</script>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body data-page="calendario">
  <!-- La cabecera y el pie se insertan desde js/app.js -->

  <main id="contenido">
    <section class="band band--art">
      <div class="band__art" aria-hidden="true">
        <div class="band__media"><img src="assets/img/colegio2.jpg" alt=""></div>
        <span class="band__dot"></span>
      </div>
      <div class="wrap">
        <span class="eyebrow eyebrow--yellow">Programación escolar</span>
        <h1>Calendario <em>académico</em></h1>
        <p>Fechas importantes, entregas de boletines, días festivos y eventos institucionales.</p>
      </div>
    </section>

    <section class="section section--page">
      <div class="wrap cal">
        <div class="cal__board">
          <div class="cal__head">
            <button class="cal__nav" id="cal-prev" type="button" aria-label="Mes anterior">←</button>
            <h2 class="cal__title" id="cal-title" aria-live="polite">Cargando…</h2>
            <button class="cal__nav" id="cal-next" type="button" aria-label="Mes siguiente">→</button>
          </div>
          <div class="cal__week" aria-hidden="true"><div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div><div>Dom</div></div>
          <div class="cal__grid" id="cal-grid"></div>
          <div class="legend">
            <span><span class="dot"></span>Académico</span>
            <span><span class="dot dot--yellow"></span>Cultural / Deportivo</span>
          </div>
        </div>
        <div class="cal__side">
          <h2 class="h2--md" id="cal-list-title" style="margin-bottom:24px">Eventos del mes</h2>
          <div class="events" id="cal-events"></div>
          <a class="btn btn--outline" id="cal-pdf" href="#" target="_blank" rel="noopener" hidden>Descargar cronograma PDF</a>
        </div>
      </div>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
