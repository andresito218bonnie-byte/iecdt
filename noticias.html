<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noticias | IE Ciudad de Tunja</title>
  <meta name="description" content="Noticias y novedades de la Institución Educativa Ciudad de Tunja.">
  <script>document.documentElement.classList.add('js');setTimeout(function(){document.documentElement.classList.add('ready')},1800)</script>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body data-page="noticias">
  <!-- La cabecera y el pie se insertan desde js/app.js -->

  <main id="contenido">
    <div class="ticker" id="ticker" hidden>
      <div class="wrap">
        <span class="ticker__label">Última hora</span>
        <div class="ticker__view"><span class="ticker__track"></span></div>
      </div>
    </div>

    <!-- Listado -->
    <section class="section section--page" id="news-list-view">
      <div class="wrap news">
        <div id="news-main"></div>
        <aside class="aside" id="news-aside" aria-label="Barra lateral"></aside>
      </div>
    </section>

    <!-- Detalle de una noticia (noticias.html?id=...) -->
    <div id="news-article-view" hidden></div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
